apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-api
  namespace: k8s-sre-lab
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/instance: k8s-sre-lab
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: k8s-sre-lab
    app.kubernetes.io/managed-by: kustomize
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-api
  # minReplicas >= 3 keeps the service available while one replica is being disrupted.
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # React immediately: capacity is the scarce resource when latency is burning.
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      # The opposite trade-off: a 10-minute window plus a 25%/60s policy means a
      # short traffic spike cannot cause a scale-in that is immediately undone, and
      # each step removes at most one pod per minute.
      stabilizationWindowSeconds: 600
      selectPolicy: Min
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
