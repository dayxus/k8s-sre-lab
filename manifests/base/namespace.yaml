apiVersion: v1
kind: Namespace
metadata:
  name: k8s-sre-lab
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/instance: k8s-sre-lab
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: k8s-sre-lab
    app.kubernetes.io/managed-by: kustomize
    # Restricted profile: the manifests below are written so that the namespace
    # refuses anything that is not non-root, dropped-capability, seccomp-filtered.
    # A policy that is only linted is a policy that drifts; this one is enforced.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
